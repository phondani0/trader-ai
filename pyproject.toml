[project]
name = "trader-ai"
version = "1.0.0"
description = "NautilusTrader-first crypto research and paper-trading workspace"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
start = "scripts.start:main"
backtest = "scripts.backtest:main"
benchmark = "scripts.benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[dependency-groups]
dev = [
    "ruff>=0.15.10",
]

[tool.ruff]
extend-exclude = [".agents"]
