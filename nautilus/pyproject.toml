[project]
name = "trader-ai-nautilus"
version = "0.1.0"
description = "Isolated NautilusTrader spike inside trader-ai"
requires-python = ">=3.12,<3.15"
dependencies = [
    "nautilus_trader",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "plotly>=6.3.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
nautilus-backtest = "nautilus_app.cli.backtest:main"
nautilus-papertrade = "nautilus_app.cli.papertrade:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nautilus_app"]
