name: Verify Trader AI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-root:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Set up Python
      run: uv python install 3.12

    - name: Sync Root Wrappers
      run: uv sync

    - name: Run Root Wrapper Tests
      run: uv run python -m unittest tests.test_nautilus_pivot

  verify-nautilus:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Set up Python
      run: uv python install 3.12

    - name: Sync Nautilus App
      run: cd nautilus && uv sync

    - name: Run Nautilus Tests
      run: cd nautilus && uv run python -m unittest discover -s tests
