# ═══════════════════════════════════════════════════
# Stock Watchlist — US Market
# ═══════════════════════════════════════════════════
# High-liquidity, high-volume stocks ideal for intraday trading
# These are well-known tickers with tight spreads and predictable patterns

# Large Cap Tech (High liquidity, excellent for intraday)
large_cap_tech:
  - AAPL     # Apple
  - MSFT     # Microsoft
  - GOOGL    # Alphabet
  - AMZN     # Amazon
  - NVDA     # NVIDIA
  - META     # Meta Platforms
  - TSLA     # Tesla (high volatility, great for momentum)
  - AMD      # Advanced Micro Devices

# Large Cap Finance
large_cap_finance:
  - JPM      # JPMorgan Chase
  - BAC      # Bank of America
  - GS       # Goldman Sachs

# High Volume / Volatile (great for day trading)
high_volume:
  - SPY      # S&P 500 ETF (most liquid in the world)
  - QQQ      # Nasdaq 100 ETF
  - IWM      # Russell 2000 ETF
  - SOFI     # SoFi Technologies (high retail volume)

# Energy
energy:
  - XOM      # ExxonMobil
  - CVX      # Chevron

# Consumer
consumer:
  - DIS      # Disney
  - NKE      # Nike

# Default active watchlist (what the bot monitors daily)
active_watchlist:
  - BTC/USD
  - ETH/USD
  - SOL/USD
  - DOGE/USD
  - LTC/USD
