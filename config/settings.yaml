# ═══════════════════════════════════════════════════
# Trader AI — Main Configuration
# ═══════════════════════════════════════════════════

trading:
  mode: paper                    # paper | live
  capital: 25000                 # Starting capital in USD
  asset_class: crypto            # crypto default | equity optional via Alpaca adapter

# Broker Selection
# Default product path: CCXT for crypto perpetuals.
# Optional adapter: "alpaca" for US equities / crypto spot experiments.
broker:
  name: ccxt
  time_in_force: gtc

# Only used by session-based brokers such as Alpaca equities.
market_hours:
  timezone: "US/Eastern"
  pre_market_start: "08:00"
  market_open: "09:30"
  orb_window_end: "10:00"
  prime_start: "10:00"
  stop_new_entries: "15:30"
  auto_square_off: "15:50"
  market_close: "16:00"

risk_management:
  max_risk_per_trade_pct: 2.0    # Max 2% capital risk per trade
  max_daily_loss_pct: 3.0        # Kill switch: stop if daily loss > 3%
  max_drawdown_pct: 20.0         # Architectural kill switch: stop after 20% peak-to-trough drawdown
  max_open_positions: 5          # Max simultaneous positions
  max_exposure_per_asset_pct: 20 # Max 20% capital in one asset
  mandatory_stop_loss: true      # Every trade MUST have a stop-loss
  trailing_stop_enabled: true
  trailing_stop_atr_multiplier: 2.0
  min_risk_reward_ratio: 1.5     # Minimum risk:reward ratio
  leverage: 5                    # Leverage (only used by brokers that support it)

discovery:
  enabled: true
  interval_minutes: 10
  min_24h_volume: 10000000
  min_price_change: 3.0
  min_trade_score: 3.0
  top_n: 5
  candidate_ttl_minutes: 30
  dynamic_monitor_size: 10
  liquid_universe_size: 30
  feature_timeframe: 5Min
  feature_window_bars: 96
  breakout_lookback_bars: 20
  momentum_lookback_bars: 12
  acceleration_lookback_bars: 3
  relative_volume_lookback_bars: 20
  min_relative_volume: 1.15
  min_intraday_momentum_pct: 1.0
  min_breakout_score: 1.0
  max_spread_bps: 35.0
  score_weights:
    liquidity: 0.2
    change_24h: 0.15
    momentum_1h: 0.25
    acceleration_15m: 0.2
    breakout: 0.15
    relative_volume: 0.05

benchmarking:
  approvals_path: data/strategy_approvals.json
  enforce_approvals: true
  min_trades: 3
  min_net_roi_pct: 0.0
  min_profit_factor: 1.0
  min_expectancy_pct: 0.0
  max_drawdown_pct: 20.0

adaptation:
  enabled: true
  suggestion_lookback_days: 14
  min_completed_discoveries: 10
  min_recent_trades: 5

data:
  candle_interval: 5Min          # 1Min | 5Min | 15Min | 1Hour
  lookback_days: 60              # Historical data for indicators
  database_path: data/trader.db
  max_bars_per_request: 1000     # Keep per-request limits exchange-friendly; DataFeed paginates as needed
  refresh_overlap_bars: 400      # Re-fetch only the recent tail once symbols are cached

watchlist:
  source: config
  max_stocks: 20
  min_price: 10.0
  max_price: 500.0
  min_avg_volume: 1000000

notifications:
  enabled: true
  telegram: true
  on_trade: true
  on_signal: false
  daily_summary: true
  on_error: true

logging:
  level: INFO
  file: logs/trader.log
  console: true
  max_size_mb: 50
  backup_count: 5
