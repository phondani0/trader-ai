# ═══════════════════════════════════════════════════
# Trader AI — Main Configuration
# ═══════════════════════════════════════════════════

trading:
  mode: paper                    # paper | live
  capital: 25000                 # Starting capital in USD
  asset_class: crypto            # crypto default | equity optional via Alpaca adapter

# Broker Selection
# Default product path: CCXT for crypto perpetuals.
# Optional adapter: "alpaca" for US equities / crypto spot experiments.
broker:
  name: ccxt
  time_in_force: gtc

# Only used by session-based brokers such as Alpaca equities.
market_hours:
  timezone: "US/Eastern"
  pre_market_start: "08:00"
  market_open: "09:30"
  orb_window_end: "10:00"
  prime_start: "10:00"
  stop_new_entries: "15:30"
  auto_square_off: "15:50"
  market_close: "16:00"

risk_management:
  max_risk_per_trade_pct: 2.0    # Max 2% capital risk per trade
  max_daily_loss_pct: 3.0        # Kill switch: stop if daily loss > 3%
  max_open_positions: 5          # Max simultaneous positions
  max_exposure_per_asset_pct: 20 # Max 20% capital in one asset
  mandatory_stop_loss: true      # Every trade MUST have a stop-loss
  trailing_stop_enabled: true
  trailing_stop_atr_multiplier: 2.0
  min_risk_reward_ratio: 1.5     # Minimum risk:reward ratio
  leverage: 5                    # Leverage (only used by brokers that support it)

data:
  candle_interval: 5Min          # 1Min | 5Min | 15Min | 1Hour
  lookback_days: 60              # Historical data for indicators
  database_path: data/trader.db
  max_bars_per_request: 10000

watchlist:
  source: config
  max_stocks: 20
  min_price: 10.0
  max_price: 500.0
  min_avg_volume: 1000000

notifications:
  enabled: true
  telegram: true
  on_trade: true
  on_signal: false
  daily_summary: true
  on_error: true

logging:
  level: INFO
  file: logs/trader.log
  console: true
  max_size_mb: 50
  backup_count: 5
