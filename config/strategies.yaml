adaptive_trend_rider:
  enabled: true
  instruments:
    - btcusdt_linear_bybit
    - ethusdt_linear_bybit
    - xrpusdt_linear_bybit
  discovery_gate: soft
  scanner_execution:
    enabled: true
    max_symbols: 5
    min_score: 10.0
    min_24h_volume: 50000000.0
    discovery_gate: hard
    blacklist:
      - XAU/USDT:USDT
      - XAUT/USDT:USDT
  params:
    fast_ema_period: 10
    slow_ema_period: 20
    warmup_diagnostics: true
    warmup_log_interval_bars: 10
    decision_diagnostics: true
    decision_log_interval_bars: 10

volume_spike_trend:
  enabled: false
  instruments:
    - ethusdt_linear_bybit
  discovery_gate: soft
  params:
    volume_multiplier: 3.0
    warmup_diagnostics: true
    warmup_log_interval_bars: 10
    decision_diagnostics: true
    decision_log_interval_bars: 10
