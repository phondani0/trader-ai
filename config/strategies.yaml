# ═══════════════════════════════════════════════════
# Strategy Parameters
# ═══════════════════════════════════════════════════

# Strategy-specific parameters. Each strategy reads its config from here.
# Modify these to tune strategy behavior without touching code.

macd_bollinger:
  enabled: true
  regime: ["sideways_low_vol", "sideways_high_vol"]
  timeframe: 5Min
  # MACD parameters
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  # Bollinger Bands parameters
  bb_period: 20
  bb_std_dev: 2.2
  # Risk
  stop_loss_atr_multiplier: 2.0
  take_profit_rr_ratio: 2.0       # Risk:Reward 1:2
  max_position_pct: 15

vwap_reversion:
  enabled: true
  regime: ["sideways_low_vol"]
  timeframe: 5Min
  # VWAP deviation threshold
  vwap_std_entry: 1.2
  vwap_std_exit: 0.5              # Exit when price returns near VWAP
  deviation_lookback: 80
  rsi_oversold: 35
  rsi_overbought: 65
  rsi_period: 14
  # Risk
  stop_loss_pct: 1.0
  atr_stop_multiplier: 1.2
  min_vwap_distance_pct: 0.25
  max_position_pct: 10

supertrend:
  enabled: true
  regime: ["trending_low_vol", "trending_high_vol"]
  timeframe: 5Min
  # Supertrend parameters
  atr_period: 14
  atr_multiplier: 2.5
  # Confirmation
  ema_period: 20
  long_term_ema_period: 200
  adx_min: 22
  slope_lookback: 12
  pullback_lookback: 8
  volume_multiplier: 1.0
  pullback_touch_atr: 0.6
  # Risk
  trailing_stop: true
  stop_buffer_atr: 0.8
  take_profit_rr_ratio: 2.2
  max_position_pct: 15

orb:
  enabled: false
  regime: ["all"]                 # Active in all regimes during ORB window
  timeframe: 5Min
  # ORB window
  orb_minutes: 30                 # First 30 minutes
  # Filters
  require_vwap_alignment: true    # Price must align with VWAP direction
  min_range_pct: 0.3              # Min ORB range as % of price
  max_range_pct: 2.0              # Max ORB range (avoid crazy opens)
  volume_multiplier: 1.5          # Volume confirmation
  # Risk
  stop_loss_at_opposite_range: true
  take_profit_rr_ratio: 2.0
  max_position_pct: 15

rsi_divergence:
  enabled: true
  regime: ["trending_low_vol", "trending_high_vol"]
  timeframe: 5Min
  rsi_period: 14
  lookback_bars: 30               # Bars to look back for divergence
  min_swing_pct: 0.3              # Min price swing to qualify
  trend_ema_period: 50
  long_term_ema_period: 200
  bullish_rsi_max: 45
  bearish_rsi_min: 55
  adx_min: 20
  # Confirmation
  require_macd_confirmation: true
  # Risk
  stop_loss_swing: true           # Stop at recent swing
  stop_loss_atr_buffer: 1.0
  take_profit_rr_ratio: 2.0
  max_position_pct: 10

ema_crossover:
  enabled: true
  regime: ["trending_low_vol"]
  timeframe: 5Min
  fast_ema: 20
  slow_ema: 50
  long_term_ema: 200
  # Filters
  require_vwap_alignment: false
  adx_min: 22
  slope_lookback: 12
  pullback_lookback: 8
  volume_multiplier: 1.0
  ema_touch_atr: 0.6
  # Risk
  stop_buffer_atr: 0.8
  take_profit_rr_ratio: 2.4
  max_position_pct: 15

donchian_breakout:
  enabled: false
  regime: ["trending_low_vol", "trending_high_vol"]
  timeframe: 5Min
  channel_period: 20
  trend_ema_period: 200
  atr_period: 14
  adx_period: 14
  volume_period: 20
  adx_min: 22
  volume_multiplier: 1.1
  breakout_buffer_atr: 0.15
  stop_loss_atr: 2.0
  take_profit_rr_ratio: 2.5
  max_position_pct: 15

chart_patterns:
  enabled: false
  regime: ["trending_high_vol"]
  timeframe: 15Min               # Patterns work better on higher timeframes
  # Pivot detection
  pivot_lookback: 5              # Candles to look back for pivot
  pivot_lookahead: 2             # Candles to confirm pivot
  # Triangle parameters
  min_touches: 3                 # Minimum touches on trendline
  convergence_threshold: 0.7     # How close lines must converge (0-1)
  # Harmonic / ABCD
  fib_tolerance: 0.05            # Tolerance for Fibonacci ratio matching
  # Risk
  stop_loss_pct: 2.5
  take_profit_rr_ratio: 2.0
  max_position_pct: 10
