adaptive_trend_rider:
  enabled: true
  instruments:
    - btcusdt_linear_bybit
    - ethusdt_linear_bybit
    - xrpusdt_linear_bybit
  discovery_gate: soft
  scanner_execution:
    enabled: true
    max_symbols: 8
    min_score: 6.0
    min_24h_volume: 15000000.0
    preload_runtime_symbols: true
    runtime_universe_size: 12
    discovery_gate: hard
    blacklist:
      - XAU/USDT:USDT
      - XAUT/USDT:USDT
      - SOXL/USDT:USDT
      - SPCX/USDT:USDT
  params:
    fast_ema_period: 10
    slow_ema_period: 20
    max_hold_bars: 288
    trade_notional_usdt: "500"
    initial_stop_atr_mult: 3.0
    trailing_activation_atr_mult: 4.0
    trailing_stop_atr_mult: 3.5
    take_profit_order_enabled: false
    take_profit_r_multiple: "2.0"
    profit_runner_enabled: true
    profit_runner_activation_r_multiple: "3.0"
    profit_runner_stop_lock_r_multiple: "0.25"
    trailing_stop_enabled: true
    trailing_replace_min_bps: 50
    warmup_diagnostics: true
    warmup_log_interval_bars: 10
    decision_diagnostics: true
    decision_log_interval_bars: 10

