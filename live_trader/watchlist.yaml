# ═══════════════════════════════════════════════════
# Market Universe
# ═══════════════════════════════════════════════════
# The default active universe is crypto-first.
# Equity lists are kept below as optional reference sets for Alpaca/session experiments.

# Default active watchlist (what the bot monitors)
# For CCXT perpetuals: use SYMBOL/USDT:USDT format
# For Alpaca equities: use plain tickers (AAPL, SPY)
# For Alpaca crypto: use SYMBOL/USD format (BTC/USD)
active_watchlist:
  - BTC/USDT:USDT
  - ETH/USDT:USDT
  - SOL/USDT:USDT
  - DOGE/USDT:USDT
  - LTC/USDT:USDT

# Optional equity reference universes

# Large Cap Tech
large_cap_tech:
  - AAPL     # Apple
  - MSFT     # Microsoft
  - GOOGL    # Alphabet
  - AMZN     # Amazon
  - NVDA     # NVIDIA
  - META     # Meta Platforms
  - TSLA     # Tesla (high volatility, great for momentum)
  - AMD      # Advanced Micro Devices

# Large Cap Finance
large_cap_finance:
  - JPM      # JPMorgan Chase
  - BAC      # Bank of America
  - GS       # Goldman Sachs

# High Volume / Volatile (great for day trading)
high_volume:
  - SPY      # S&P 500 ETF (most liquid in the world)
  - QQQ      # Nasdaq 100 ETF
  - IWM      # Russell 2000 ETF
  - SOFI     # SoFi Technologies (high retail volume)

# Energy
energy:
  - XOM      # ExxonMobil
  - CVX      # Chevron

# Consumer
consumer:
  - DIS      # Disney
  - NKE      # Nike
